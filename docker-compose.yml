# Production compose — service sits behind the existing Docker nginx on the
# pre-created `nginx_bridge_network`. For nginx-less local testing use
# `docker-compose.local.yml` instead.
#
# Multi-account note:
#   The service rotates `CODEX_HOME` through every entry in $CODEX_HOMES on a
#   round-robin basis, so each request consumes quota from a different
#   ChatGPT subscription. Each account must have its own dir on the host
#   under ~/codex-homes/<label>/, populated by:
#     mkdir -p ~/codex-homes/<label>
#     CODEX_HOME=~/codex-homes/<label> codex login
#   Then set in .env (colon-separated paths as seen *inside the container*):
#     CODEX_HOMES=/host_codex_homes/personal:/host_codex_homes/team
#
# Single-account fallback: leave CODEX_HOMES empty and the service uses the
# container's default $HOME/.codex (mounted below as a thin compatibility
# shim from ${HOME}/.codex if present).

services:
  codex-image-service:
    build:
      context: .
      args:
        # Match the host operator's UID/GID so files written into bind
        # mounts (especially ~/codex-homes/*/ during codex login or token
        # refresh) stay readable by the host user.
        APP_UID: ${UID:-1000}
        APP_GID: ${GID:-1000}
    container_name: codex-image-service
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      ADMIN_URL_PREFIX: ${ADMIN_URL_PREFIX:-}
      GENERATED_DIR: /app/static/generated
      CODEX_WORKDIR: /app/data/codex-runs
      DATABASE_URL: sqlite:////app/data/app.db
      # Paths the *container* uses; the host parent dir is mounted below.
      # Leave empty for single-account ($HOME/.codex) — the existing default.
      # Set in .env when you're ready for multi-account, e.g.
      #   CODEX_HOMES=/host_codex_homes/personal:/host_codex_homes/team
      CODEX_HOMES: ${CODEX_HOMES:-}
    volumes:
      - ./data:/app/data
      - ./static/generated:/app/static/generated
      # Single-account default mount: empty RW base + RO file overlays.
      # Codex CLI needs to write sessions, history.jsonl, logs, PATH-update
      # checks inside CODEX_HOME, so a flat :ro mount breaks startup with
      # "failed to initialize in-process app-server client". The base
      # `./data/codex-home` is a per-container scratch dir we create on
      # build; the two file overlays keep auth.json / config.toml read-only
      # so the host's interactive codex stays the source of truth for
      # tokens. Override CODEX_HOMES in .env to point elsewhere.
      - ./data/codex-home:/home/app/.codex
      - ${HOME}/.codex/auth.json:/home/app/.codex/auth.json:ro
      - ${HOME}/.codex/config.toml:/home/app/.codex/config.toml:ro
      # Multi-account parent dir. Each subdir under ~/codex-homes/ is a
      # service-dedicated CODEX_HOME (created via
      # `CODEX_HOME=~/codex-homes/<label> codex login`). Mounted RW because
      # codex needs to write sessions + refreshes tokens inside the directory.
      # IMPORTANT: concurrent refresh of one home's auth.json (two workers, or
      # a host-side `codex` run on the same dir) trips ChatGPT's refresh-token
      # reuse-detection and revokes the whole token family. The service guards
      # each home with an flock on `<home>/.codex-exec.lock`; any host-side
      # script touching these homes must take the same lock, e.g.:
      #   flock ~/codex-homes/<label>/.codex-exec.lock \
      #     env CODEX_HOME=~/codex-homes/<label> codex exec ...
      - ${HOME}/codex-homes:/host_codex_homes
    networks:
      - nginx_bridge_network

networks:
  nginx_bridge_network:
    external: true
